<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidamsoft Inc</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: #ffffff;
    }

    main {
      text-align: center;
      padding: 2rem;
      max-width: 40rem;
    }

    h1 {
      margin-bottom: 0.75rem;
      font-size: clamp(2.5rem, 5vw, 4rem);

    p {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sidamsoft Inc</h1>
    <p>Welcome to Sidamsoft Website.</p>

</html>
